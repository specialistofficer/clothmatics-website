<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none">
  <defs>
    <linearGradient id="watch-case" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#bcc2d1"/>
      <stop offset="100%" stop-color="#767f94"/>
    </linearGradient>
    <linearGradient id="watch-dial" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a24"/>
      <stop offset="100%" stop-color="#0b0c12"/>
    </linearGradient>
    <linearGradient id="leather-strap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b2b20"/>
      <stop offset="50%" stop-color="#4d392b"/>
      <stop offset="100%" stop-color="#2a1e16"/>
    </linearGradient>
    <filter id="watch-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#5B3DF5" flood-opacity="0.2"/>
    </filter>
  </defs>

  <g class="garment-base" filter="url(#watch-shadow)">
    <!-- Upper Strap -->
    <path d="M136 40 L184 40 L184 100 L136 100 Z" fill="url(#leather-strap)" stroke="#221811" stroke-width="1.2"/>
    <line x1="140" y1="42" x2="140" y2="98" stroke="#684f3e" stroke-width="1" stroke-dasharray="3 2"/>
    <line x1="180" y1="42" x2="180" y2="98" stroke="#684f3e" stroke-width="1" stroke-dasharray="3 2"/>

    <!-- Lower Strap -->
    <path d="M136 220 L184 220 L184 280 L136 280 Z" fill="url(#leather-strap)" stroke="#221811" stroke-width="1.2"/>
    <line x1="140" y1="222" x2="140" y2="278" stroke="#684f3e" stroke-width="1" stroke-dasharray="3 2"/>
    <line x1="180" y1="222" x2="180" y2="278" stroke="#684f3e" stroke-width="1" stroke-dasharray="3 2"/>

    <!-- Case Lugs -->
    <path d="M132 105 L136 90 L146 90 L142 110 Z" fill="#9da5b8"/>
    <path d="M188 105 L184 90 L174 90 L178 110 Z" fill="#9da5b8"/>
    <path d="M132 215 L136 230 L146 230 L142 210 Z" fill="#9da5b8"/>
    <path d="M188 215 L184 230 L174 230 L178 210 Z" fill="#9da5b8"/>

    <!-- Round Case Bezel -->
    <circle cx="160" cy="160" r="58" fill="url(#watch-case)" stroke="#535c70" stroke-width="1.5"/>
    <circle cx="160" cy="160" r="52" fill="#0d0e14"/>
    <circle cx="160" cy="160" r="50" fill="url(#watch-dial)"/>

    <!-- Crown -->
    <rect x="218" y="154" width="6" height="12" rx="1.5" fill="#c4cad6" stroke="#485163" stroke-width="1"/>

    <!-- Dial hour indices -->
    <line x1="160" y1="114" x2="160" y2="122" stroke="#ffffff" stroke-width="2"/>
    <line x1="160" y1="206" x2="160" y2="198" stroke="#ffffff" stroke-width="2"/>
    <line x1="114" y1="160" x2="122" y2="160" stroke="#ffffff" stroke-width="2"/>
    <line x1="206" y1="160" x2="198" y2="160" stroke="#ffffff" stroke-width="2"/>

    <!-- Minimalist Watch Hands -->
    <line x1="160" y1="160" x2="160" y2="130" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="160" y1="160" x2="185" y2="160" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="160" y1="160" x2="140" y2="180" stroke="#EC4899" stroke-width="1" stroke-linecap="round"/>
    <circle cx="160" cy="160" r="3" fill="#EC4899"/>
  </g>
</svg>
