<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" fill="none">
  <defs>
    <linearGradient id="body-contour" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#5B3DF5" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.4"/>
    </linearGradient>
    <radialGradient id="aura-glow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#5B3DF5" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#EC4899" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Aura -->
  <circle cx="200" cy="220" r="180" fill="url(#aura-glow)"/>

  <!-- Stylized Human Profile & Bust Outline -->
  <g filter="url(#glow-blur)">
    <!-- Head & Neck Contour (Side/Angled Silhouette) -->
    <path d="M190 70 C 230 70, 245 95, 245 130 C 245 155, 235 175, 222 188 C 226 200, 232 215, 240 225 L290 250 C 330 270, 340 310, 340 380 L340 500 L60 500 L60 380 C 60 310, 70 270, 110 250 L160 225 C 168 215, 174 200, 178 188 C 165 175, 155 155, 155 130 C 155 95, 170 70, 190 70 Z" fill="#0d0b1a" stroke="url(#body-contour)" stroke-width="2" opacity="0.9"/>

    <!-- Subtle Internal Anatomic Light Contours -->
    <!-- Shoulder Lines -->
    <path d="M125 280 C 160 265, 240 265, 275 280" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6"/>
    <!-- Center Sternum Axis -->
    <line x1="200" y1="230" x2="200" y2="460" stroke="#5B3DF5" stroke-width="1.2" stroke-dasharray="2 4" opacity="0.5"/>
    <!-- Chest / Torso Arc -->
    <path d="M140 340 C 170 360, 230 360, 260 340" stroke="#EC4899" stroke-width="1.5" stroke-dasharray="3 5" opacity="0.6"/>
    <!-- Waist Arc -->
    <path d="M150 420 C 175 435, 225 435, 250 420" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5"/>
  </g>

  <!-- Neural Constellation Points -->
  <g class="neural-nodes">
    <!-- Head / Style Mind -->
    <circle cx="200" cy="130" r="4.5" fill="#EC4899"/>
    <circle cx="200" cy="130" r="9" stroke="#EC4899" stroke-width="1" stroke-dasharray="2 2" opacity="0.8"/>

    <!-- Left / Right Shoulder Points -->
    <circle cx="115" cy="270" r="4" fill="#5B3DF5"/>
    <circle cx="285" cy="270" r="4" fill="#5B3DF5"/>

    <!-- Core / Heart (Personal Style) -->
    <circle cx="200" cy="300" r="5" fill="#ffffff"/>
    <circle cx="200" cy="300" r="12" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.9"/>

    <!-- Left / Right Torso Points -->
    <circle cx="140" cy="370" r="3.5" fill="#7C3AED"/>
    <circle cx="260" cy="370" r="3.5" fill="#7C3AED"/>

    <!-- Waist Center Point -->
    <circle cx="200" cy="430" r="4" fill="#5B3DF5"/>

    <!-- Neural Connecting Strands -->
    <line x1="200" y1="130" x2="200" y2="300" stroke="#EC4899" stroke-width="1" stroke-dasharray="3 3" opacity="0.7"/>
    <line x1="200" y1="300" x2="115" y2="270" stroke="#5B3DF5" stroke-width="1" stroke-dasharray="3 3" opacity="0.7"/>
    <line x1="200" y1="300" x2="285" y2="270" stroke="#5B3DF5" stroke-width="1" stroke-dasharray="3 3" opacity="0.7"/>
    <line x1="200" y1="300" x2="140" y2="370" stroke="#7C3AED" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>
    <line x1="200" y1="300" x2="260" y2="370" stroke="#7C3AED" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>
    <line x1="140" y1="370" x2="200" y2="430" stroke="#5B3DF5" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>
    <line x1="260" y1="370" x2="200" y2="430" stroke="#5B3DF5" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>
  </g>
</svg>
