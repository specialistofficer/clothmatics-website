<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" fill="none">
  <defs>
    <linearGradient id="navy-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2238"/>
      <stop offset="50%" stop-color="#141726"/>
      <stop offset="100%" stop-color="#0a0c16"/>
    </linearGradient>
    <linearGradient id="collar-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#282d4a"/>
      <stop offset="100%" stop-color="#121524"/>
    </linearGradient>
    <linearGradient id="pocket-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#232842"/>
      <stop offset="100%" stop-color="#111422"/>
    </linearGradient>
    <linearGradient id="ai-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5B3DF5" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#7C3AED" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="garment-shadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#5B3DF5" flood-opacity="0.15"/>
    </filter>
  </defs>

  <g class="garment-base" filter="url(#garment-shadow)">
    <!-- Back Collar & Interior -->
    <path d="M150 78 C 175 68, 225 68, 250 78 C 240 100, 160 100, 150 78 Z" fill="#0d0f1a"/>
    <path d="M170 85 L230 85" stroke="#333959" stroke-width="2" stroke-dasharray="2 3"/>

    <!-- Sleeves -->
    <!-- Left Sleeve -->
    <path d="M130 95 L50 200 C 45 220, 75 235, 90 220 L135 155 Z" fill="url(#navy-body)"/>
    <path d="M52 205 L88 223" stroke="#2c3252" stroke-width="1.5"/>
    <!-- Right Sleeve -->
    <path d="M270 95 L350 200 C 355 220, 325 235, 310 220 L265 155 Z" fill="url(#navy-body)"/>
    <path d="M348 205 L312 223" stroke="#2c3252" stroke-width="1.5"/>

    <!-- Main Torso Body -->
    <path d="M130 95 L150 80 C 180 88, 220 88, 250 80 L270 95 L265 380 C 265 390, 250 395, 200 395 C 150 395, 135 390, 135 380 Z" fill="url(#navy-body)"/>

    <!-- Hem stitching -->
    <path d="M138 385 C 170 390, 230 390, 262 385" stroke="#2f3554" stroke-width="2" stroke-dasharray="4 3"/>

    <!-- Front Placket -->
    <path d="M194 92 L194 395 L206 395 L206 92 Z" fill="#181c2e"/>
    <path d="M194 92 L194 395" stroke="#2b314d" stroke-width="1"/>
    <path d="M206 92 L206 395" stroke="#2b314d" stroke-width="1"/>

    <!-- Lapel / Collar Left -->
    <path d="M150 80 L180 145 L200 95 L170 78 Z" fill="url(#collar-grad)" stroke="#2f3659" stroke-width="1.5"/>
    <!-- Lapel / Collar Right -->
    <path d="M250 80 L220 145 L200 95 L230 78 Z" fill="url(#collar-grad)" stroke="#2f3659" stroke-width="1.5"/>

    <!-- Left Chest Utility Pocket -->
    <path d="M148 160 L185 160 L185 210 C 185 218, 148 218, 148 210 Z" fill="url(#pocket-grad)" stroke="#2b3252" stroke-width="1.5"/>
    <path d="M145 156 L188 156 L188 166 L145 166 Z" fill="#20243b" stroke="#333b61" stroke-width="1"/>
    <!-- Right Chest Utility Pocket -->
    <path d="M215 160 L252 160 L252 210 C 252 218, 215 218, 215 210 Z" fill="url(#pocket-grad)" stroke="#2b3252" stroke-width="1.5"/>
    <path d="M212 156 L255 156 L255 166 L212 166 Z" fill="#20243b" stroke="#333b61" stroke-width="1"/>

    <!-- Horn / Pearl Buttons -->
    <g fill="#434c75" stroke="#10121d" stroke-width="1">
      <circle cx="200" cy="165" r="4.5"/>
      <circle cx="200" cy="215" r="4.5"/>
      <circle cx="200" cy="265" r="4.5"/>
      <circle cx="200" cy="315" r="4.5"/>
      <circle cx="200" cy="365" r="4.5"/>
    </g>
    <!-- Button thread cross -->
    <g stroke="#ffffff" stroke-width="0.8" opacity="0.6">
      <line x1="198" y1="165" x2="202" y2="165"/><line x1="200" y1="163" x2="200" y2="167"/>
      <line x1="198" y1="215" x2="202" y2="215"/><line x1="200" y1="213" x2="200" y2="217"/>
      <line x1="198" y1="265" x2="202" y2="265"/><line x1="200" y1="263" x2="200" y2="267"/>
      <line x1="198" y1="315" x2="202" y2="315"/><line x1="200" y1="313" x2="200" y2="317"/>
      <line x1="198" y1="365" x2="202" y2="365"/><line x1="200" y1="363" x2="200" y2="367"/>
    </g>

    <!-- Subtle studio fabric drape fold highlights -->
    <path d="M155 240 Q 165 290 152 350" stroke="#252b47" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <path d="M245 240 Q 235 290 248 350" stroke="#252b47" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- AI Detection Wireframe Overlay (Active during Scene 2 scan) -->
  <g class="garment-ai-mesh" opacity="0">
    <path d="M130 95 L150 80 L250 80 L270 95 L265 380 L135 380 Z" stroke="url(#ai-glow)" stroke-width="1.5" stroke-dasharray="6 4" fill="none"/>
    <line x1="130" y1="95" x2="50" y2="200" stroke="url(#ai-glow)" stroke-width="1.2" stroke-dasharray="4 4"/>
    <line x1="270" y1="95" x2="350" y2="200" stroke="url(#ai-glow)" stroke-width="1.2" stroke-dasharray="4 4"/>
    <!-- Key Points -->
    <circle cx="200" cy="88" r="3" fill="#EC4899"/>
    <circle cx="130" cy="95" r="3" fill="#5B3DF5"/>
    <circle cx="270" cy="95" r="3" fill="#5B3DF5"/>
    <circle cx="166" cy="185" r="2.5" fill="#7C3AED"/>
    <circle cx="234" cy="185" r="2.5" fill="#7C3AED"/>
    <circle cx="200" cy="380" r="3" fill="#EC4899"/>
  </g>
</svg>
