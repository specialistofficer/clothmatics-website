<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Example of a good full outfit photo</title>
  <desc id="desc">A person standing straight in bright even light with their complete outfit and shoes visible inside the camera frame.</desc>
