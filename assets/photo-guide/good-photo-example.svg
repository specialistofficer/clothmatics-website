    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#2b1d55" flood-opacity=".16"/></filter>
  </defs>
  <rect width="800" height="500" rx="28" fill="url(#bg)"/>
  <circle cx="118" cy="88" r="58" fill="#fff" opacity=".7"/><circle cx="690" cy="410" r="95" fill="#eadfff" opacity=".65"/>
